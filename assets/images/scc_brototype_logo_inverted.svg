<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" fill="none">
  <!-- STARTUP in bold black uppercase font -->
  <text x="35" y="66" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0D0F14" letter-spacing="-0.01em">
    STARTUP
  </text>
  
  <!-- CLUB in white text inside solid black rounded rectangle -->
  <rect x="250" y="24" width="155" height="52" rx="4" fill="#0D0F14" />
  <text x="272" y="65" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-0.01em">
    CLUB
  </text>
  
  <!-- Subtitle rule: — CLUB YOU NEVER HAD — -->
  <line x1="40" y1="92" x2="115" y2="92" stroke="#4B5563" stroke-width="1.2" />
  <text x="126" y="96" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="12" fill="#374151" letter-spacing="0.22em">
    CLUB YOU NEVER HAD
  </text>
  <line x1="325" y1="92" x2="400" y2="92" stroke="#4B5563" stroke-width="1.2" />
  
  <!-- BROTOTYPE centered -->
  <text x="220" y="138" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0D0F14" letter-spacing="0.16em">
    BROTOTYPE
  </text>
</svg>
