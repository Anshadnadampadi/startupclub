<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="sccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Shield / Hexagon Frame -->
    <polygon points="24,2 44,14 44,38 24,50 4,38 4,14" fill="#0F172A" stroke="url(#sccGrad)" stroke-width="2.5" />
    <!-- Code Bracket Left -->
    <path d="M16 20L10 26L16 32" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code Bracket Right -->
    <path d="M32 20L38 26L32 32" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ascending Rocket -->
    <path d="M24 12C21 17 20 22 20 27L24 25L28 27C28 22 27 17 24 12Z" fill="url(#sccGrad)" filter="url(#glow)"/>
    <polygon points="24,26 21.5,31 24,30 26.5,31" fill="url(#rocketGrad)" />
    <!-- Small star spark -->
    <circle cx="24" cy="9" r="1.5" fill="#38BDF8" />
  </g>
  <!-- Brand Text -->
  <text x="64" y="28" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="0.5">
    STARTUP CLUB
  </text>
  <text x="64" y="46" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#10B981" letter-spacing="3.5">
    CALICUT
  </text>
</svg>
